{% extends "base.html" %}

{% block title %}Set New Password - Amar Hishab{% endblock %}

{% block extra_css %}
<style>
  .reset-wrap {
    min-height: calc(100vh - 180px);
    display: grid;
    place-items: center;
    padding: 20px 0;
  }
  .reset-card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 38px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .reset-card h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .reset-card p.sub {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px var(--emerald-glow);
  }
  .reset-submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--emerald);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    margin-top: 8px;
  }
  .reset-submit-btn:hover {
    background: var(--emerald-dark);
  }
</style>
{% endblock %}

{% block content %}
<div class="reset-wrap">
  <div class="reset-card">
    <h1 data-en="Set New Password" data-bn="নতুন পাসওয়ার্ড দিন">Set New Password</h1>
    <p class="sub" data-en="Enter the 6-digit reset code sent to your email and your new password."
       data-bn="ইমেইলে পাঠানো ৬ ডিজিটের রিসেট কোড এবং নতুন পাসওয়ার্ড দিন।">
      Enter the 6-digit reset code sent to your email and your new password.
    </p>

    <form method="post" action="{% url 'account_password_reset_confirm' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="email" data-en="Email Address" data-bn="ইমেইল ঠিকানা">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" value="{{ email }}" required>
      </div>

      <div class="form-group">
        <label for="code" data-en="6-Digit Reset Code" data-bn="৬ ডিজিটের রিসেট কোড">6-Digit Reset Code</label>
        <input type="text" id="code" name="code" class="form-input" maxlength="6" value="{{ code }}" required
               placeholder="••••••" style="letter-spacing: 4px; font-weight: 700;">
      </div>

      <div class="form-group">
        <label for="new_password" data-en="New Password (min 8 chars)" data-bn="নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)">New Password (min 8 chars)</label>
        <input type="password" id="new_password" name="new_password" class="form-input" required minlength="8"
               placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="confirm_password" data-en="Confirm New Password" data-bn="নতুন পাসওয়ার্ড নিশ্চিত করুন">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="8"
               placeholder="••••••••">
      </div>

      <button type="submit" class="reset-submit-btn" data-en="Update Password" data-bn="পাসওয়ার্ড আপডেট করুন">
        Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
