{% extends "base.html" %}

{% block title %}Reset Password - Amar Hishab{% endblock %}

{% block extra_css %}
<style>
  .reset-wrap {
    min-height: calc(100vh - 180px);
    display: grid;
    place-items: center;
    padding: 20px 0;
  }
  .reset-card {
    width: min(460px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 38px 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .reset-card h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .reset-card p.sub {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px var(--emerald-glow);
  }
  .reset-submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    background: var(--emerald);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    margin-top: 6px;
  }
  .reset-submit-btn:hover {
    background: var(--emerald-dark);
  }
  .back-link {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
  }
  .back-link a {
    color: var(--emerald);
    text-decoration: none;
    font-weight: 600;
  }
</style>
{% endblock %}

{% block content %}
<div class="reset-wrap">
  <div class="reset-card">
    <div style="font-size: 38px; margin-bottom: 12px;">🔑</div>
    <h1 data-en="Reset Password" data-bn="পাসওয়ার্ড রিসেট">Reset Password</h1>
    <p class="sub" data-en="Enter your registered email address and we'll send you a 6-digit password reset code."
       data-bn="আপনার নিবন্ধিত ইমেইল ঠিকানা দিন। আমরা একটি ৬ ডিজিটের রিসেট কোড পাঠাব।">
      Enter your registered email address and we'll send you a 6-digit password reset code.
    </p>

    <form method="post" action="{% url 'account_password_reset' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="email" data-en="Registered Email Address" data-bn="নিবন্ধিত ইমেইল ঠিকানা">Registered Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required autofocus
               placeholder="you@example.com">
      </div>

      <button type="submit" class="reset-submit-btn" data-en="Send Reset Code" data-bn="রিসেট কোড পাঠান">
        Send Reset Code
      </button>
    </form>

    <div class="back-link">
      <a href="{% url 'account_login' %}" data-en="← Back to Sign In" data-bn="← লগইন পৃষ্ঠায় ফিরে যান">← Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
